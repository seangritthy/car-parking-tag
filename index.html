<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Parking Tag - ជូនដំណឹងម្ចាស់ឡាន</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(18, 22, 33, 0.78);
            --card-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f2fe;
            --neon-purple: #4facfe;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --success-color: #00e676;
            --error-color: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Kantumruy Pro', 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(79, 172, 254, 0.16), transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.14), transparent 38%),
                radial-gradient(circle at 50% 50%, rgba(10, 14, 24, 0.95), transparent 100%);
            padding: 24px 16px;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glow in background */
        body::before {
            content: '';
            position: absolute;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.12), transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            filter: blur(50px);
            z-index: 0;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 36px 28px;
            border-radius: 28px;
            border: 1px solid var(--card-border);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 35px rgba(0, 242, 254, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--neon-purple), transparent);
        }

        /* Language Switcher Styling */
        .lang-switcher {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 24px;
        }

        .lang-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lang-btn:hover {
            color: #ffffff;
        }

        .lang-btn.active {
            color: #05101a;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.35);
        }

        /* Badge Pill */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.22);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--neon-blue);
            letter-spacing: 0.5px;
            margin-bottom: 22px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--neon-blue);
            box-shadow: 0 0 8px var(--neon-blue);
            animation: blink 1.8s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.85); }
        }

        /* Vehicle Icon */
        .icon-wrapper {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.12), rgba(79, 172, 254, 0.05));
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 26px;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.15);
            font-size: 42px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        h1 {
            font-size: 23px;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.5;
            color: #ffffff;
        }

        p {
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 400;
            line-height: 1.75;
            margin-bottom: 28px;
            padding: 0 4px;
        }

        /* Notify Button */
        .notify-button {
            position: relative;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #05101a;
            border: none;
            padding: 17px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 10px 25px rgba(0, 242, 254, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .notify-button:hover {
            box-shadow: 
                0 14px 32px rgba(0, 242, 254, 0.5),
                0 0 20px rgba(79, 172, 254, 0.4);
            transform: translateY(-2px);
        }

        .notify-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .notify-button:disabled {
            background: #1e2230;
            color: #646b80;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            min-height: 24px;
            line-height: 1.6;
            transition: all 0.3s ease;
        }
        
        #status.success {
            color: var(--success-color);
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.3);
            padding: 14px 18px;
            border-radius: 16px;
            animation: fadeIn 0.4s ease;
        }

        #status.error {
            color: var(--error-color);
            background: rgba(255, 82, 82, 0.12);
            border: 1px solid rgba(255, 82, 82, 0.3);
            padding: 14px 18px;
            border-radius: 16px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-notice {
            margin-top: 22px;
            font-size: 12px;
            color: #555d73;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <!-- Language Switcher: Khmer First -->
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchLang('km')" id="btn-km">🇰🇭 ខ្មែរ</button>
            <button class="lang-btn" onclick="switchLang('en')" id="btn-en">English</button>
            <button class="lang-btn" onclick="switchLang('zh')" id="btn-zh">中文</button>
        </div>

        <div>
            <div class="badge">
                <span class="pulse-dot"></span>
                <span id="badgeText">សេចក្តីជូនដំណឹងការចត</span>
            </div>
        </div>

        <div class="icon-wrapper">🚘</div>
        
        <h1 id="titleText">ត្រូវការឱ្យខ្ញុំរំកិលឡានមែនទេ?</h1>
        <p id="descText">សូមចុចប៊ូតុងខាងក្រោម នោះខ្ញុំនឹងទទួលបានការជូនដំណឹងភ្លាមៗ ដើម្បីមករំកិលឡានរបស់ខ្ញុំ។</p>

        <button id="notifyBtn" class="notify-button" onclick="sendNotification()">🔔 ជូនដំណឹងដល់ម្ចាស់ឡាន</button>
        
        <div id="status"></div>

        <div class="footer-notice">Car Parking Alert System</div>
    </div>

    <script>
        // --- TRANSLATION DICTIONARY (KHMER FIRST) ---
        const translations = {
            km: {
                badge: "សេចក្តីជូនដំណឹងការចត",
                title: "ត្រូវការឱ្យខ្ញុំរំកិលឡានមែនទេ?",
                desc: "សូមចុចប៊ូតុងខាងក្រោម នោះខ្ញុំនឹងទទួលបានការជូនដំណឹងភ្លាមៗ ដើម្បីមករំកិលឡានរបស់ខ្ញុំ។",
                btnDefault: "🔔 ជូនដំណឹងដល់ម្ចាស់ឡាន",
                btnSending: "⏳ កំពុងផ្ញើការជូនដំណឹង...",
                success: "✅ បានផ្ញើការជូនដំណឹង! ម្ចាស់កំពុងធ្វើដំណើរមក។",
                error: "⚠️ ការតភ្ជាប់បរាជ័យ។ សូមព្យាយាមម្តងទៀត។"
            },
            en: {
                badge: "Parking Notification",
                title: "Need me to move?",
                desc: "Tap the button below and I will receive a secure alert to come move my vehicle immediately.",
                btnDefault: "🔔 Notify Owner",
                btnSending: "⏳ SENDING ALERT...",
                success: "✅ ALERT SENT. OWNER EN ROUTE.",
                error: "⚠️ CONNECTION FAILED. TRY AGAIN."
            },
            zh: {
                badge: "车辆挪车通知",
                title: "需要我挪车吗？",
                desc: "点击下方按钮，我将立即收到安全提醒并前来挪车。",
                btnDefault: "🔔 通知车主",
                btnSending: "⏳ 正在发送提醒...",
                success: "✅ 提醒已发送。车主正在赶来。",
                error: "⚠️ 连接失败。请重试。"
            }
        };

        let currentLang = 'km';

        // --- LANGUAGE SWITCHER LOGIC ---
        function switchLang(lang) {
            currentLang = lang;
            
            // Update text on the screen
            const badge = document.getElementById('badgeText');
            if (badge && translations[lang].badge) {
                badge.innerText = translations[lang].badge;
            }
            document.getElementById('titleText').innerText = translations[lang].title;
            document.getElementById('descText').innerText = translations[lang].desc;
            
            // Only update the button text if it hasn't been clicked yet
            const btn = document.getElementById('notifyBtn');
            if (!btn.disabled) {
                btn.innerText = translations[lang].btnDefault;
            }

            // Update button styles
            document.getElementById('btn-km').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-zh').classList.remove('active');
            document.getElementById('btn-' + lang).classList.add('active');
        }

        // --- NOTIFICATION LOGIC (PRESERVED WEBHOOK FOR TELEGRAM) ---
        function sendNotification() {
            // --- ENTER YOUR MAKE.COM WEBHOOK URL HERE ---
            const webhookUrl = 'https://hook.us2.make.com/2136rv0c9tt7b4x38i2lajk92pb4rfys'; 
            // --------------------------------------------
            
            const btn = document.getElementById('notifyBtn');
            const statusText = document.getElementById('status');

            btn.disabled = true;
            btn.innerText = translations[currentLang].btnSending;
            statusText.innerText = "";
            statusText.classList.remove("error", "success");

            fetch(webhookUrl, { method: 'POST' })
                .then(response => {
                    if (response.ok || response.status === 200) {
                        statusText.innerText = translations[currentLang].success;
                        statusText.classList.add("success");
                        btn.style.display = 'none';
                    } else {
                        throw new Error('Webhook failed');
                    }
                })
                .catch(error => {
                    statusText.innerText = translations[currentLang].error;
                    statusText.classList.add("error");
                    btn.disabled = false;
                    btn.innerText = translations[currentLang].btnDefault;
                });
        }
    </script>
</body>
</html>

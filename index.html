<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Parking Tag</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;500;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 25, 0.6);
            --neon-blue: #00f2fe;
            --neon-purple: #4facfe;
            --text-main: #ffffff;
            --text-sub: #a0a0ab;
        }

        body {
            /* Now supports Khmer characters beautifully */
            font-family: 'Outfit', 'Noto Sans Khmer', sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.15), transparent 25%);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-main);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 380px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--neon-purple), transparent);
        }

        /* Language Switcher Styling */
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .lang-btn.active {
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            background: rgba(0, 242, 254, 0.1);
        }

        .icon {
            font-size: 54px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        p {
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .notify-button {
            background: linear-gradient(90deg, var(--neon-purple) 0%, var(--neon-blue) 100%);
            color: #000;
            border: none;
            padding: 18px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
            transition: all 0.3s ease;
            width: 100%;
            font-family: inherit;
        }

        .notify-button:hover {
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }

        .notify-button:disabled {
            background: #2a2a35;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--neon-blue);
            min-height: 20px;
        }
        
        .error {
            color: #ff4757 !important;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchLang('en')" id="btn-en">English</button>
            <button class="lang-btn" onclick="switchLang('km')" id="btn-km">ខ្មែរ</button>
            <button class="lang-btn" onclick="switchLang('zh')" id="btn-zh">中文</button>
        </div>

        <div class="icon">🚘</div>
        
        <h1 id="titleText">Need me to move?</h1>
        <p id="descText">Tap the button below and I will receive a secure alert to come move my vehicle immediately.</p>

        <button id="notifyBtn" class="notify-button" onclick="sendNotification()">Notify Owner</button>
        
        <div id="status"></div>
    </div>

    <script>
        // --- TRANSLATION DICTIONARY ---
        const translations = {
            en: {
                title: "Need me to move?",
                desc: "Tap the button below and I will receive a secure alert to come move my vehicle immediately.",
                btnDefault: "Notify Owner",
                btnSending: "SENDING ALERT...",
                success: "ALERT SENT. OWNER EN ROUTE.",
                error: "CONNECTION FAILED. TRY AGAIN."
            },
            km: {
                title: "ត្រូវការឱ្យខ្ញុំរំកិលឡានមែនទេ?",
                desc: "សូមចុចប៊ូតុងខាងក្រោម នោះខ្ញុំនឹងទទួលបានការជូនដំណឹងភ្លាមៗ ដើម្បីមករំកិលឡានរបស់ខ្ញុំ។",
                btnDefault: "ជូនដំណឹងដល់ម្ចាស់ឡាន",
                btnSending: "កំពុងផ្ញើការជូនដំណឹង...",
                success: "បានផ្ញើការជូនដំណឹង។ ម្ចាស់កំពុងធ្វើដំណើរមក។",
                error: "ការតភ្ជាប់បរាជ័យ។ សូមព្យាយាមម្តងទៀត។"
            },
            zh: {
                title: "需要我挪车吗？",
                desc: "点击下方按钮，我将立即收到安全提醒并前来挪车。",
                btnDefault: "通知车主",
                btnSending: "正在发送提醒...",
                success: "提醒已发送。车主正在赶来。",
                error: "连接失败。请重试。"
            }
        };

        let currentLang = 'en';

        // --- LANGUAGE SWITCHER LOGIC ---
        function switchLang(lang) {
            currentLang = lang;
            
            // Update text on the screen
            document.getElementById('titleText').innerText = translations[lang].title;
            document.getElementById('descText').innerText = translations[lang].desc;
            
            // Only update the button text if it hasn't been clicked yet
            const btn = document.getElementById('notifyBtn');
            if (!btn.disabled) {
                btn.innerText = translations[lang].btnDefault;
            }

            // Update button styles
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-km').classList.remove('active');
            document.getElementById('btn-zh').classList.remove('active');
            document.getElementById('btn-' + lang).classList.add('active');
        }

        // --- NOTIFICATION LOGIC ---
        function sendNotification() {
            // --- ENTER YOUR MAKE.COM WEBHOOK URL HERE ---
            const webhookUrl = 'https://hook.us2.make.com/2136rv0c9tt7b4x38i2lajk92pb4rfys'; 
            // --------------------------------------------
            
            const btn = document.getElementById('notifyBtn');
            const statusText = document.getElementById('status');

            btn.disabled = true;
            btn.innerText = translations[currentLang].btnSending;
            statusText.innerText = "";
            statusText.classList.remove("error");

            fetch(webhookUrl, { method: 'POST' })
                .then(response => {
                    if (response.ok || response.status === 200) {
                        statusText.innerText = translations[currentLang].success;
                        btn.style.display = 'none';
                    } else {
                        throw new Error('Webhook failed');
                    }
                })
                .catch(error => {
                    statusText.innerText = translations[currentLang].error;
                    statusText.classList.add("error");
                    btn.disabled = false;
                    btn.innerText = translations[currentLang].btnDefault;
                });
        }
    </script>
</body>
</html>

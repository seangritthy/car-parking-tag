<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Car Tag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        /* The physical card size (roughly 5x7 inches) */
        .print-card {
            background-color: white;
            width: 500px;
            height: 700px;
            padding: 40px;
            box-sizing: border-box;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 8px solid #111;
        }

        .header {
            background-color: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 42px;
            color: #111;
            margin: 20px 0 10px 0;
            line-height: 1.1;
            font-weight: 900;
        }

        p.subtitle {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border: 4px dashed #ccc;
            border-radius: 15px;
            display: inline-block;
            margin: 0 auto;
        }

        /* Automatically generates the QR code using a free API */
        .qr-code {
            width: 250px;
            height: 250px;
            display: block;
        }

        .footer {
            margin-top: 30px;
            font-size: 18px;
            color: #333;
            font-weight: 700;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .camera-icon {
            font-size: 24px;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* When you hit Ctrl+P, this removes the background so it prints perfectly */
        @media print {
            body {
                background-color: white;
                align-items: flex-start;
            }
            .print-card {
                box-shadow: none;
                border: 6px solid #000;
            }
        }
    </style>
</head>
<body>

    <div class="print-card">
        <div class="header">
            ⚠️ Parking Notice
        </div>

        <div>
            <h1>NEED ME<br>TO MOVE?</h1>
            <p class="subtitle">Please do not tow or ticket.</p>
        </div>

        <div class="qr-container">
            <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://seangritthy.github.io/car-parking-tag/&margin=0" alt="QR Code">
        </div>

        <div class="footer">
            <span class="camera-icon">📷</span> Scan with your phone camera to send me an instant alert.
        </div>
    </div>

</body>
</html>

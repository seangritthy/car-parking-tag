<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Car Tag - Multi-Language</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+Khmer:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Fallback font stack for all three languages */
            font-family: 'Inter', 'Noto Sans Khmer', 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .print-card {
            background-color: white;
            width: 500px;
            min-height: 750px;
            padding: 35px;
            box-sizing: border-box;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 8px solid #111;
        }

        .header {
            background-color: #ff4757;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .header-sub {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0px;
        }

        .title-group {
            margin: 25px 0;
        }

        h1 {
            font-size: 38px;
            color: #111;
            margin: 0 0 5px 0;
            line-height: 1.1;
            font-weight: 900;
        }

        h2 {
            font-size: 24px;
            color: #222;
            margin: 8px 0;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 14px;
            color: #e84118;
            margin-top: 15px;
            font-weight: 700;
            background: #fdf0f0;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .qr-container {
            background: white;
            padding: 15px;
            border: 4px dashed #ccc;
            border-radius: 15px;
            display: inline-block;
            margin: 0 auto;
        }

        .qr-code {
            width: 220px;
            height: 220px;
            display: block;
        }

        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #333;
            font-weight: 700;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
            text-align: left;
        }

        .camera-icon {
            font-size: 24px;
            vertical-align: middle;
            margin-right: 8px;
            float: left;
        }

        /* Removes the gray background when printing */
        @media print {
            body {
                background-color: white;
                align-items: flex-start;
                padding: 0;
            }
            .print-card {
                box-shadow: none;
                border: 6px solid #000;
            }
        }
    </style>
</head>
<body>

    <div class="print-card">
        <div class="header">
            ⚠️ PARKING NOTICE<br>
            <span class="header-sub">សេចក្តីជូនដំណឹងអំពីការចត • 停车通知</span>
        </div>

        <div class="title-group">
            <h1>NEED ME TO MOVE?</h1>
            <h2>ត្រូវការឱ្យខ្ញុំរំកិលឡានមែនទេ?</h2>
            <h2>需要我挪车吗？</h2>
            
            <div class="subtitle">
                Please do not tow or ticket.<br>
                សូមកុំអូស ឬផាកពិន័យ។<br>
                请勿拖车或罚款。
            </div>
        </div>

        <div class="qr-container">
            <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://seangritthy.github.io/car-parking-tag/&margin=0" alt="QR Code">
        </div>

        <div class="footer">
            <span class="camera-icon">📷</span>
            <strong>EN:</strong> Scan to send me an instant alert.<br>
            <strong>KM:</strong> ស្កេនដើម្បីផ្ញើការជូនដំណឹងមកខ្ញុំភ្លាមៗ។<br>
            <strong>ZH:</strong> 扫码立即通知我挪车。
        </div>
    </div>

</body>
</html>

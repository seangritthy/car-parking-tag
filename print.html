<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Tag</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&family=Outfit:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff; /* White background for preview */
            margin: 0;
        }

        .kh { font-family: 'Battambang', sans-serif; }
        .en { font-family: 'Outfit', sans-serif; }
        .zh { font-family: 'Noto Sans SC', sans-serif; }

        /* Transparent Sticker Container */
        .sticker-card {
            background-color: transparent; /* Transparent for printing */
            width: 450px;
            padding: 20px;
            text-align: center;
            border: none;
        }

        h1.kh { font-size: 32px; margin: 0 0 5px 0; color: #000; }
        h2 { font-size: 20px; margin: 2px 0; color: #333; }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 15px 0;
        }

        .footer {
            font-size: 14px;
            font-weight: 700;
            color: #000;
            line-height: 1.5;
            text-align: center;
        }

        .camera-icon { font-size: 20px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="sticker-card">
        <h1 class="kh">ត្រូវការឱ្យខ្ញុំរំកិលឡានមែនទេ?</h1>
        <h2 class="en">NEED ME TO MOVE?</h2>
        <h2 class="zh">需要我挪车吗？</h2>

        <!-- Green QR Code (color=00b894 is the green hex) -->
        <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://seangritthy.github.io/car-parking-tag/&margin=0&color=00b894" alt="QR Code">

        <div class="footer">
            <span class="camera-icon">📷</span>
            <span class="kh">ស្កេនដើម្បីផ្ញើការជូនដំណឹង</span><br>
            <span class="en">Scan to send instant alert</span><br>
            <span class="zh">扫码立即通知我</span>
        </div>
    </div>

</body>
</html>
